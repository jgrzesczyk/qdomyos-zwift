name: Build Windows (custom)

on:
  workflow_dispatch:
    inputs:
      hide:
        description: "Widgets to hide (comma separated)"
        default: "label_17,label_10,odometer,label_19,label_12,calories,label_22,label_23,cadence,resistanceMinus,resistancePlus,label_24,label_25,resistance,label_4,label_16,watt,fanSpeedMinus,fanBar,label_21,fanSpeedPlus,weightIcon,weightDescription,weight,label_9,trainProgramTotalDistance,Difficult,difficulty"
        required: true
      big:
        description: "Widgets to enlarge (comma separated)"
        default: "speed,inclination,heartrate,elevationGain,pace,label,label_2,label_3,label_11,label_27,label_7,speedMinus,speedPlus,inclinationMinus,inclinationPlus"
        required: true
      fontsize:
        description: "Font size (pt) for enlarged widgets"
        default: "22"
        required: true
      huge:
        description: "Widgets with extra big font (comma separated)"
        default: "pace,heartrate,trainProgramCurrentRowElapsedTime"
        required: true
      hugesize:
        description: "Extra big font size (pt)"
        default: "48"
        required: true
      rowcolor:
        description: "Current step highlight color (R,G,B)"
        default: "40,110,60"
        required: true

jobs:
  build:
    runs-on: windows-2022
    steps:
      # Qt6 source (same branch the official MSVC2022 build uses)
      - uses: actions/checkout@v4
        with:
          repository: cagnulein/qdomyos-zwift
          ref: qt6
          submodules: recursive

      # Patch src/mainwindow.cpp (hide, fonts, layout, train table)
      - name: Patch UI
        shell: pwsh
        run: |
          $code = @()
          foreach ($w in "${{ github.event.inputs.hide }}".Split(",")) { $code += "    ui->$($w.Trim())->setVisible(false);" }
          foreach ($w in "${{ github.event.inputs.big }}".Split(",")) {
            $w = $w.Trim()
            $maxw = if ($w -match "(Minus|Plus)$") { "90" } else { "QWIDGETSIZE_MAX" }
            $code += "    { QFont f = ui->$w->font(); f.setPointSize(${{ github.event.inputs.fontsize }}); ui->$w->setFont(f); ui->$w->setMaximumWidth($maxw); }"
          }
          foreach ($w in "${{ github.event.inputs.huge }}".Split(",")) {
            $w = $w.Trim()
            $code += "    { QFont f = ui->$w->font(); f.setPointSize(${{ github.event.inputs.hugesize }}); f.setWeight(QFont::Black); ui->$w->setFont(f); }"
          }
          # Inclination -> own line under Speed; Heart rate -> same line as Pace
          $code += "    ui->horizontalLayout_8->removeWidget(ui->frame_2);"
          $code += "    for (int i = 0; i < ui->verticalLayout_4->count(); i++) if (ui->verticalLayout_4->itemAt(i)->layout() == ui->horizontalLayout_8) { ui->verticalLayout_4->insertWidget(i + 1, ui->frame_2); break; }"
          $code += "    ui->horizontalLayout_8->removeWidget(ui->frame_3);"
          $code += "    ui->horizontalLayout_18->addWidget(ui->frame_3);"
          # Remaining time -> own row (under the table), value bold like Pace
          $code += "    ui->horizontalLayout_11->removeWidget(ui->label_7);"
          $code += "    ui->horizontalLayout_11->removeWidget(ui->trainProgramCurrentRowElapsedTime);"
          $code += "    ui->horizontalLayout_12->addWidget(ui->label_7);"
          $code += "    ui->horizontalLayout_12->addWidget(ui->trainProgramCurrentRowElapsedTime, 1);"
          # Zwift button same height as Treadmill / Chart buttons
          $code += "    ui->connectionToZwift->setMinimumHeight(qMax(ui->connectionToTreadmill->sizeHint().height(), ui->chart->sizeHint().height()));"
          # allow maximize / minimize (QDialog has no such buttons by default)
          $code += "    setWindowFlags(windowFlags() | Qt::Window | Qt::WindowMinMaxButtonsHint);"
          $code += "    ui->label_7->setText(QStringLiteral(""Current Row Remaining Time:""));"

          # update(): remaining time instead of elapsed + highlight/scroll to current step
          $old = 'trainProgram->currentRowElapsedTime().toString(QStringLiteral("hh:mm:ss")));'
          $new = @'
          trainProgram->currentRowRemainingTime().toString(QStringLiteral("hh:mm:ss")));
                      {
                          static int qzLastStep = -1;
                          static int qzLastRows = -1;
                          int step = trainProgram->currentRowIndex();
                          int rows = ui->tableWidget->rowCount();
                          if (step != qzLastStep || rows != qzLastRows) {
                              qzLastStep = step;
                              qzLastRows = rows;
                              const QSignalBlocker qzBlock(ui->tableWidget); // no cellChanged -> no crash / program reset
                              for (int r = 0; r < rows; r++) {
                                  for (int c = 0; c < ui->tableWidget->columnCount(); c++) {
                                      QTableWidgetItem *it = ui->tableWidget->item(r, c);
                                      if (!it)
                                          continue;
                                      it->setBackground(r == step ? QBrush(QColor(${{ github.event.inputs.rowcolor }})) : QBrush());
                                      QFont f = it->font();
                                      f.setBold(r == step);
                                      it->setFont(f);
                                  }
                              }
                              if (step >= 0 && step < rows && ui->tableWidget->item(step, 0))
                                  ui->tableWidget->scrollToItem(ui->tableWidget->item(step, 0), QAbstractItemView::PositionAtTop);
                          }
                      }
          '@

          $f = "src/mainwindow.cpp"
          $c = Get-Content $f -Raw
          if (-not $c.Contains($old)) { throw "anchor for update() not found" }
          $c = $c.Replace($old, $new)
          $c = $c.Replace("ui->setupUi(this);", "ui->setupUi(this);`n" + ($code -join "`n"))
          Set-Content $f $c
          Get-Content $f -TotalCount 80

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtnetworkauth qtcharts qtconnectivity qtspeech qtpositioning qtwebsockets qtlocation qtmultimedia qtwebengine qtwebview qtwebchannel qthttpserver'
          dir: "${{ github.workspace }}/qt/"
          cache: true

      - name: Install MSVC compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # vcpkg (protobuf/abseil) not needed: the .pri does not link them, and their DLLs are already in your output folder
      - name: Build
        env:
          CL: /MP   # compile several .cpp files in parallel
        run: |
          lrelease src/qdomyos-zwift.pri
          qmake
          nmake

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: qz-windows-custom
          path: src/debug/qdomyos-zwift.exe
